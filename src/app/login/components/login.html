<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <div class="brand-mark" aria-hidden="true">L</div>
    <p class="eyebrow">PORTAL SEGURO</p>
    <h1 id="login-title">Bienvenido</h1>
    <p class="intro">Inicia sesión con tu cuenta para continuar.</p>

    <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm">
      <label for="correo">Correo electrónico</label>
      <input
        id="correo"
        name="correo"
        type="email"
        [(ngModel)]="correo"
        placeholder="tu@correo.com"
        autocomplete="username"
        required
      />

      <label for="contrasena">Contraseña</label>
      <input
        id="contrasena"
        name="contrasena"
        type="password"
        [(ngModel)]="contrasena"
        placeholder="Ingresa tu contraseña"
        autocomplete="current-password"
        required
      />

      @if (error) {
        <p class="error-message" role="alert">{{ error }}</p>
      }

      <button type="submit" [disabled]="loginForm.invalid || cargando">
        {{ cargando ? 'Validando…' : 'Iniciar sesión' }}
        @if (!cargando) {
          <span aria-hidden="true">→</span>
        }
      </button>
    </form>

    <aside class="demo-accounts" aria-label="Cuentas de demostración">
      <p class="demo-title">Cuentas de demostración</p>
      <p><strong>Administradora:</strong> admin@demo.com / Admin123!</p>
      <p><strong>Usuario:</strong> usuario@demo.com / Usuario123!</p>
    </aside>
    
  </section>
</main>
